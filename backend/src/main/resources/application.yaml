spring:
  config:
    import: classpath:market-data.yaml
  application:
    name: investment-os-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investment_os}
    username: ${DB_USERNAME:investment_os}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: investment_os
        jdbc:
          time_zone: UTC
  flyway:
    schemas: investment_os
    clean-disabled: true

logging:
  structured:
    format:
      console: ecs

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: server:/health
        readiness:
          include: readinessState,db
          additional-path: server:/ready
